<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>EchoEx - Horários e Capacidade</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .schedule-card {
            display: flex;
            background-color: #E0E0E0;
            border: 3px solid #3A5D2E;
            border-radius: 25px;
            overflow: hidden;
            margin-bottom: 20px;
        }
        .schedule-img {
            width: 45%;
            height: 160px;
            position: relative;
        }
        .schedule-img img { width: 100%; height: 100%; object-fit: cover; }
        .schedule-img h2 {
            position: absolute;
            bottom: 15px;
            left: 20px;
            color: white;
            font-size: 36px;
            text-shadow: 2px 2px 4px #000;
        }
        .schedule-info {
            padding: 15px 25px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 8px;
            color: #333;
            font-weight: 600;
        }
        .schedule-info div { display: flex; align-items: center; gap: 10px; }
    </style>
</head>
<body>
    <main class="main-content">
        <header class="top-bar">
            <div class="page-title">Operação / <span>Horários e capacidade</span></div>
            <div class="help-btn">?</div>
        </header>

        <section class="content-body">
            <!-- Card 1: Recife -->
            <div class="schedule-card">
                <div class="schedule-img">
                    <img src="https://images.unsplash.com/photo-1579783902614-a3fb3927b675?w=600">
                    <h2>Recife</h2>
                </div>
                <div class="schedule-info">
                    <div><i class="fa-regular fa-clock"></i> Horário do local - 11:20</div>
                    <div><i class="fa-solid fa-truck-ramp-box"></i> Horário de entrega - 16:30</div>
                    <div><i class="fa-solid fa-location-dot"></i> Distância - 5,4km</div>
                    <div><i class="fa-solid fa-warehouse"></i> Capacidade - 600kg</div>
                </div>
            </div>

            <!-- Card 2: Madagascar -->
            <div class="schedule-card">
                <div class="schedule-img">
                    <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=600">
                    <h2>Madagascar</h2>
                </div>
                <div class="schedule-info">
                    <div><i class="fa-regular fa-clock"></i> Horário do local - 17:07</div>
                    <div><i class="fa-solid fa-truck-ramp-box"></i> Horário de entrega - 20:30</div>
                    <div><i class="fa-solid fa-location-dot"></i> Distância - 9.152km</div>
                    <div><i class="fa-solid fa-warehouse"></i> Capacidade - 600kg</div>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
