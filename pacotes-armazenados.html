<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>EchoEx - Pacotes Armazenados</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <main class="main-content">
        <header class="top-bar">
            <div class="page-title">Operação / <span>Pacotes Armazenados</span></div>
            <div class="help-btn">?</div>
        </header>

        <section class="content-body">
            <div class="search-bar">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" placeholder="Buscar no armazenamento...">
            </div>

            <div class="cards-grid">
                <div class="item-card">
                    <img src="https://images.unsplash.com/photo-1546182990-dffeafbe841d?w=200" class="item-thumb" alt="Jabuti">
                    <div class="item-info">
                        <h3>Jabuti</h3>
                        <p>Empresa: Madagascar</p>
                    </div>
                </div>

                <!-- Botão Adicionar Pacote -->
                <div class="item-card" style="justify-content: center; cursor: pointer;">
                    <i class="fa-solid fa-plus" style="font-size: 40px; color: #3A5D2E;"></i>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
