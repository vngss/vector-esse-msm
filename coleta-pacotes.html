<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>EchoEx - Coleta de Pacotes</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <main class="main-content">
        <header class="top-bar">
            <div class="page-title">Operação / <span>Coleta de pacotes</span></div>
            <div class="help-btn">?</div>
        </header>

        <section class="content-body" style="display: flex; flex-direction: column; gap: 20px;">
            <div style="position: relative; height: 160px; border-radius: 20px; overflow: hidden; border: 3px solid #3A5D2E;">
                <img src="https://images.unsplash.com/photo-1559827291-72ee739d0d9a?w=1000" style="width: 100%; height: 100%; object-fit: cover;">
                <div style="position: absolute; right: 20px; top: 30px; text-align: right; color: white;">
                    <h2 style="font-size: 48px; text-shadow: 2px 2px 4px #000;">Mangroove</h2>
                    <p style="font-size: 20px; text-shadow: 1px 1px 3px #000;">Distância: 670 metros</p>
                </div>
            </div>

            <div style="position: relative; height: 160px; border-radius: 20px; overflow: hidden; border: 3px solid #3A5D2E;">
                <img src="https://images.unsplash.com/photo-1534188753412-3e26d0d618d6?w=1000" style="width: 100%; height: 100%; object-fit: cover;">
                <div style="position: absolute; right: 20px; top: 30px; text-align: right; color: white;">
                    <h2 style="font-size: 48px; text-shadow: 2px 2px 4px #000;">Madagascar</h2>
                    <p style="font-size: 20px; text-shadow: 1px 1px 3px #000;">Distância: 9.152km</p>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
